name: Lint & Build

env:
  NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

permissions: {}

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Setup Node Environment
        uses: ./.github/workflows/setup-env
        with:
          npmAuthToken: $NODE_AUTH_TOKEN

      - name: Run lint
        run: yarn lint

      - name: Run build
        run: yarn build

      - name: Audit dependencies for known vulnerabilities
        # Gates CI on npm advisories at severity >= high.
        # `--recursive` includes transitive dependencies.
        # If a finding here is acceptable (e.g. upstream patch pending),
        # add `--exclude <package>` for the specific package with a comment
        # explaining why, rather than lowering the severity threshold.
        run: yarn npm audit --severity high --recursive
