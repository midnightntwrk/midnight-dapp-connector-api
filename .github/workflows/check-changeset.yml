name: Check for Changeset

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-changeset:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.tool-versions'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # BASE_REF is passed via env (not interpolated into the script) so an
      # attacker-crafted base branch name can't inject shell.
      - name: Verify that a changeset exists
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          yarn changeset status --since="origin/$BASE_REF" --verbose
