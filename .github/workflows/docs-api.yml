name: Publish documentation

# Writes use the MidnightCI PAT so the docs PR's required checks run (GITHUB_TOKEN
# PRs trigger none); secrets are only exposed after the dependency install and build.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-api
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node Environment
        uses: ./.github/workflows/setup-env

      - name: Generate documentation
        run: yarn build:docs

      - name: Detect docs changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No documentation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: steps.changes.outputs.changed == 'true'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MIDNIGHTCI_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      # The empty changeset satisfies check-changeset, and -s satisfies the required DCO check.
      - name: Commit and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          BRANCH: api-docs/update
        run: |
          set -euo pipefail
          git config user.name "MidnightCI"
          git config user.email "midnight-automation+midnightci@iohk.io"
          git config user.signingkey "$GPG_FINGERPRINT"
          git config commit.gpgsign true
          gh auth setup-git

          git switch -c "$BRANCH"
          printf -- '---\n---\n\ndocs: regenerate API docs (no release)\n' \
            > ".changeset/api-docs-${GITHUB_SHA:0:7}.md"
          git add docs .changeset
          git commit -s -m "docs: regenerate API docs"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: regenerate API docs" \
              --body "Regenerated by the docs workflow from ${GITHUB_SHA}." \
              --label bot:github-actions
          fi
