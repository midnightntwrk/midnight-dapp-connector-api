version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # v2 only runs with @changesets/cli v3; migrate both together by hand.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

